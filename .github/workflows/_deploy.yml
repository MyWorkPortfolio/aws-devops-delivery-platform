name: deploy-environment

# Reusable: deploy one immutable image tag to one environment.
# Called by deploy.yml (promotion) and rollback.yml (redeploy a known good tag).

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      committed_at:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.apply.outputs.service_url }}
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_image_tag: ${{ inputs.image_tag }}
      TF_VAR_app_version: ${{ inputs.image_tag }}
      TF_VAR_repository: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Optional settings
        env:
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
        run: |
          if [ -n "$ALARM_EMAIL" ]; then echo "TF_VAR_alarm_email=$ALARM_EMAIL" >> "$GITHUB_ENV"; fi
          if [ -n "$CERTIFICATE_ARN" ]; then echo "TF_VAR_certificate_arn=$CERTIFICATE_ARN" >> "$GITHUB_ENV"; fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploytrack-${{ inputs.environment }}-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan
        run: |
          terraform plan -out=tfplan -no-color | tee plan.txt
          {
            echo "### Terraform plan: ${{ inputs.environment }}"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply (waits for ECS steady state)
        id: apply
        run: |
          terraform apply -auto-approve tfplan
          echo "service_url=$(terraform output -raw service_url)" >> "$GITHUB_OUTPUT"

      - name: Smoke test new version
        id: smoke
        run: ../../../scripts/smoke_test.sh "${{ steps.apply.outputs.service_url }}" "${{ inputs.image_tag }}" 600

      - name: Record deployment in DeployTrack
        if: always() && steps.apply.outputs.service_url != ''
        env:
          DEPLOYTRACK_URL: ${{ steps.apply.outputs.service_url }}
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.image_tag }}
          COMMIT_SHA: ${{ inputs.image_tag }}
          STATUS: ${{ steps.smoke.outcome == 'success' && 'success' || 'failed' }}
          COMMITTED_AT: ${{ inputs.committed_at }}
          STARTED_AT: ${{ steps.start.outputs.started_at }}
        run: ../../../scripts/record_deployment.sh
