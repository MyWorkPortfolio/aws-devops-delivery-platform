apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deploytrack.fullname" . }}
  labels:
    {{- include "deploytrack.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "deploytrack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deploytrack.selectorLabels" . | nindent 8 }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "deploytrack.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "deploytrack.selectorLabels" . | nindent 14 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ include "deploytrack.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEPLOYTRACK_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: DEPLOYTRACK_VERSION
              value: {{ include "deploytrack.tag" . | quote }}
            - name: DEPLOYTRACK_STORAGE_BACKEND
              value: {{ .Values.config.storageBackend | quote }}
            - name: DEPLOYTRACK_DYNAMODB_TABLE
              value: {{ .Values.config.dynamodbTable | quote }}
            - name: DEPLOYTRACK_AWS_REGION
              value: {{ .Values.config.awsRegion | quote }}
            - name: DEPLOYTRACK_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
