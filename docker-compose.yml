# Full local stack that mirrors production: app + DynamoDB + Prometheus + Grafana.
#   make up     -> http://localhost:8080/docs  (API)
#                  http://localhost:9090       (Prometheus, alerts loaded)
#                  http://localhost:3000       (Grafana, dashboard provisioned)
name: deploytrack

x-local-aws: &local-aws
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_DEFAULT_REGION: us-east-1

services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["8000:8000"]

  dynamodb-init:
    image: amazon/aws-cli:2.17.0
    depends_on: [dynamodb]
    environment: *local-aws
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do sleep 1; done
        aws dynamodb create-table --endpoint-url http://dynamodb:8000 \
          --table-name deploytrack-local \
          --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST >/dev/null || true
        echo "table ready"

  app:
    build:
      context: ./app
      args:
        APP_VERSION: local
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      <<: *local-aws
      DEPLOYTRACK_ENVIRONMENT: local
      DEPLOYTRACK_STORAGE_BACKEND: dynamodb
      DEPLOYTRACK_DYNAMODB_TABLE: deploytrack-local
      DEPLOYTRACK_DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
    ports: ["8080:8080"]
    read_only: true

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
